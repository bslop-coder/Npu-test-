name: make-block
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      -       - run: pip install litert-torch
      - run: python make_block.py
      - uses: actions/upload-artifact@v4
        with:
          name: block
          path: block.tflite
