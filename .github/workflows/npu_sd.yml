name: npu-sd
on: workflow_dispatch
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: restore models
        uses: actions/cache/restore@v4
        with:
          path: models
          key: anima-models-v1
          fail-on-cache-miss: true
      - name: restore dumps
        uses: actions/cache/restore@v4
        with:
          path: |
            dumpA
            dumpB
            statsA
          key: dumps-v1
          fail-on-cache-miss: true
      - name: build pack
        env:
          PACK_BLOCKS: "13"
        run: |
          pip install numpy
          python3 - <<'EOF'
          import os, json, struct
          import numpy as np

          blocks = [int(b) for b in os.environ.get('PACK_BLOCKS', '13').split(',')]
          T = 256
          absmax, sumsq, outm = {}, {}, {}
          for line in open('statsA/chan_absmax.txt'):
              p = line.rstrip('\n').split('\t')
              absmax[p[0]] = np.array(p[2].split(), dtype=np.float64)
          for line in open('statsA/chan_sumsq.txt'):
              p = line.rstrip('\n').split('\t')
              sumsq[p[0]] = (float(p[1]), np.array(p[3].split(), dtype=np.float64))
          for line in open('statsA/out_amax.txt'):
              p = line.rstrip('\n').split('\t')
              outm[p[0]] = float(p[1])

          fh = open('models/dit.safetensors', 'rb')
          hl = struct.unpack('<Q', fh.read(8))[0]
          hdr = json.loads(fh.read(hl))
          base = 8 + hl
          keymap = {}
          for k in hdr:
              if k == '__metadata__' or 'llm_adapter' in k or 'blocks.' not in k:
                  continue
              keymap[k[k.index('blocks.'):]] = k

          def get_w(name):
              key = keymap[name[name.index('blocks.'):]]
              m = hdr[key]
              s0, e0 = m['data_offsets']
              fh.seek(base + s0)
              raw = fh.read(e0 - s0)
              if m['dtype'] == 'BF16':
                  a = (np.frombuffer(raw, dtype=np.uint16).astype(np.uint32) << 16).view(np.float32)
              elif m['dtype'] == 'F16':
                  a = np.frombuffer(raw, dtype=np.float16).astype(np.float32)
              else:
                  a = np.frombuffer(raw, dtype=np.float32)
              return a.reshape(m['shape']).astype(np.float32)

          os.makedirs('pack', exist_ok=True)
          count = 0
          for name in sorted(n for n in outm if n in absmax and n in sumsq and 'net.blocks.' in n):
              b = int(name.split('net.blocks.')[1].split('.')[0])
              if b not in blocks:
                  continue
              short = 'b%d_%s' % (b, name.split('blocks.%d.' % b)[1].replace('.weight', '').replace('.', '_'))
              W = get_w(name)
              dout, din = W.shape
              am = absmax[name]
              cnt, sq = sumsq[name]
              rms = np.sqrt(np.maximum(sq / max(cnt, 1.0), 0.0))
              med = np.median(rms)
              s = np.clip(np.sqrt(np.maximum(rms, 1e-6) / max(med, 1e-6)), 0.05, 20.0).astype(np.float32)
              in_scale = float(np.max(am / s)) / 127.0
              out_scale = outm[name] / 127.0
              Wp = (W * s[None, :]).astype(np.float32)
              ws = np.maximum(np.abs(Wp).max(axis=1), 1e-8) / 127.0
              qW = np.clip(np.rint(Wp / ws[:, None]), -127, 127).astype(np.int8)
              open('pack/%s.meta' % short, 'w').write('%d %d %d %.9g %.9g\n' % (din, dout, T, in_scale, out_scale))
              qW.tofile('pack/%s.w' % short)
              ws.astype(np.float32).tofile('pack/%s.ws' % short)
              s.tofile('pack/%s.s' % short)
              count += 1
              print('packed', short, din, dout)
          print('layers packed', count)
          EOF
          du -sh pack
      - name: build patched sd-cli for android
        run: |
          git clone https://github.com/leejet/stable-diffusion.cpp sd
          cd sd
          git checkout 0886f11b6b8b4d1f6259e0f1337cae554284c37a
          git submodule update --init --recursive
          cd ..
          echo ---- custom op api in this ggml
          grep -n -B1 -A12 "ggml_custom_4d" sd/ggml/include/ggml.h | head -40 || true
          python3 - <<'EOF'
          HEAD = '#include <android/NeuralNetworks.h>\n#include <algorithm>\n#include <chrono>\n#include <cmath>\n#include <cstdio>\n#include <cstdlib>\n#include <cstring>\n#include <fstream>\n#include <string>\n#include <unordered_map>\n#include <vector>\n'
          HELPERS = r'''
          static double sd_now_ms() {
              auto t = std::chrono::steady_clock::now().time_since_epoch();
              return std::chrono::duration<double, std::milli>(t).count();
          }

          static bool sd_read_file(const std::string& path, std::vector<char>& out) {
              std::ifstream f(path, std::ios::binary);
              if (!f) {
                  return false;
              }
              f.seekg(0, std::ios::end);
              size_t n = (size_t)f.tellg();
              f.seekg(0, std::ios::beg);
              out.resize(n);
              f.read(out.data(), (std::streamsize)n);
              return (bool)f;
          }

          static void sd_mix_bytes(uint64_t h[4], const void* p, size_t n) {
              const uint8_t* b = (const uint8_t*)p;
              size_t i         = 0;
              for (; i + 8 <= n; i += 8) {
                  uint64_t v;
                  memcpy(&v, b + i, 8);
                  for (int k = 0; k < 4; k++) {
                      h[k] ^= v + 0x9E3779B97F4A7C15ULL * (uint64_t)(k + 1) + (h[k] << 6) + (h[k] >> 2);
                  }
              }
              for (; i < n; i++) {
                  for (int k = 0; k < 4; k++) {
                      h[k] ^= b[i];
                      h[k] *= 1099511628211ULL;
                  }
              }
          }

          struct SdNpuLayer {
              int din         = 0;
              int dout        = 0;
              int T           = 256;
              float in_scale  = 0.f;
              float out_scale = 0.f;
              std::vector<float> inv;
              std::vector<char> w;
              std::vector<float> ws;
              std::vector<int32_t> bias;
              std::vector<int8_t> qin;
              std::vector<int8_t> qout;
              ANeuralNetworksModel* model      = nullptr;
              ANeuralNetworksCompilation* comp = nullptr;
          };

          struct SdNpuStats {
              double npu_ms  = 0;
              double prep_ms = 0;
              long calls     = 0;
              long tiles     = 0;
              ~SdNpuStats() {
                  if (calls > 0) {
                      fprintf(stderr, "[npu] calls %ld tiles %ld npu_ms %.0f prep_ms %.0f\n", calls, tiles, npu_ms, prep_ms);
                  }
              }
          };
          static SdNpuStats g_sd_npu_stats;

          static std::unordered_map<std::string, SdNpuLayer*>& sd_npu_reg() {
              static auto* m = new std::unordered_map<std::string, SdNpuLayer*>();
              return *m;
          }

          static const ANeuralNetworksDevice* sd_npu_device() {
              static const ANeuralNetworksDevice* dev = nullptr;
              static bool done                        = false;
              if (!done) {
                  done             = true;
                  const char* want = getenv("SD_NPU_DEV") ? getenv("SD_NPU_DEV") : "mtk-mdla";
                  uint32_t nd      = 0;
                  ANeuralNetworks_getDeviceCount(&nd);
                  for (uint32_t i = 0; i < nd; i++) {
                      ANeuralNetworksDevice* d = nullptr;
                      ANeuralNetworks_getDevice(i, &d);
                      const char* nm = nullptr;
                      ANeuralNetworksDevice_getName(d, &nm);
                      if (nm != nullptr && strcmp(nm, want) == 0) {
                          dev = d;
                      }
                  }
                  fprintf(stderr, "[npu] device %s %s\n", want, dev ? "found" : "NOT FOUND");
              }
              return dev;
          }

          #define SD_NCK(x)                                                                       \
              do {                                                                                \
                  int r_ = (x);                                                                   \
                  if (r_ != ANEURALNETWORKS_NO_ERROR) {                                           \
                      fprintf(stderr, "[npu] NNAPI error %d at line %d: %s\n", r_, __LINE__, #x); \
                      return nullptr;                                                             \
                  }                                                                               \
              } while (0)

          static SdNpuLayer* sd_npu_load(const std::string& shortn) {
              const char* pack  = getenv("SD_NPU_PACK");
              const char* cache = getenv("SD_NPU_CACHE");
              if (pack == nullptr || cache == nullptr) {
                  return nullptr;
              }
              const ANeuralNetworksDevice* dev = sd_npu_device();
              if (dev == nullptr) {
                  return nullptr;
              }
              std::string base = std::string(pack) + "/" + shortn;
              std::ifstream m(base + ".meta");
              if (!m) {
                  return nullptr;
              }
              SdNpuLayer* L = new SdNpuLayer();
              m >> L->din >> L->dout >> L->T >> L->in_scale >> L->out_scale;
              std::vector<char> raw;
              std::vector<float> s;
              if (!sd_read_file(base + ".w", L->w) || !sd_read_file(base + ".ws", raw)) {
                  return nullptr;
              }
              L->ws.resize(raw.size() / 4);
              memcpy(L->ws.data(), raw.data(), raw.size());
              if (!sd_read_file(base + ".s", raw)) {
                  return nullptr;
              }
              s.resize(raw.size() / 4);
              memcpy(s.data(), raw.data(), raw.size());
              if ((long)L->w.size() != (long)L->din * L->dout || (int)L->ws.size() != L->dout || (int)s.size() != L->din) {
                  fprintf(stderr, "[npu] bad pack sizes for %s\n", shortn.c_str());
                  return nullptr;
              }
              L->inv.resize((size_t)L->din);
              for (int j = 0; j < L->din; j++) {
                  L->inv[(size_t)j] = 1.0f / (s[(size_t)j] * L->in_scale);
              }
              L->qin.assign((size_t)L->T * L->din, 0);
              L->qout.assign((size_t)L->T * L->dout, 0);
              L->bias.assign((size_t)L->dout, 0);
              double t0 = sd_now_ms();
              SD_NCK(ANeuralNetworksModel_create(&L->model));
              uint32_t in_dims[4]  = {1, (uint32_t)L->T, 1, (uint32_t)L->din};
              uint32_t w_dims[4]   = {(uint32_t)L->dout, 1, 1, (uint32_t)L->din};
              uint32_t b_dims[1]   = {(uint32_t)L->dout};
              uint32_t out_dims[4] = {1, (uint32_t)L->T, 1, (uint32_t)L->dout};
              ANeuralNetworksOperandType t_in  = {ANEURALNETWORKS_TENSOR_QUANT8_ASYMM_SIGNED, 4, in_dims, L->in_scale, 0};
              ANeuralNetworksOperandType t_w   = {ANEURALNETWORKS_TENSOR_QUANT8_SYMM_PER_CHANNEL, 4, w_dims, 0.0f, 0};
              ANeuralNetworksOperandType t_b   = {ANEURALNETWORKS_TENSOR_INT32, 1, b_dims, 0.0f, 0};
              ANeuralNetworksOperandType t_i32 = {ANEURALNETWORKS_INT32, 0, nullptr, 0.0f, 0};
              ANeuralNetworksOperandType t_out = {ANEURALNETWORKS_TENSOR_QUANT8_ASYMM_SIGNED, 4, out_dims, L->out_scale, 0};
              SD_NCK(ANeuralNetworksModel_addOperand(L->model, &t_in));
              SD_NCK(ANeuralNetworksModel_addOperand(L->model, &t_w));
              SD_NCK(ANeuralNetworksModel_addOperand(L->model, &t_b));
              SD_NCK(ANeuralNetworksModel_addOperand(L->model, &t_i32));
              SD_NCK(ANeuralNetworksModel_addOperand(L->model, &t_i32));
              SD_NCK(ANeuralNetworksModel_addOperand(L->model, &t_i32));
              SD_NCK(ANeuralNetworksModel_addOperand(L->model, &t_i32));
              SD_NCK(ANeuralNetworksModel_addOperand(L->model, &t_out));
              ANeuralNetworksSymmPerChannelQuantParams qp;
              qp.channelDim = 0;
              qp.scaleCount = (uint32_t)L->dout;
              qp.scales     = L->ws.data();
              SD_NCK(ANeuralNetworksModel_setOperandSymmPerChannelQuantParams(L->model, 1, &qp));
              int32_t pad = ANEURALNETWORKS_PADDING_VALID;
              int32_t one = 1;
              int32_t act = ANEURALNETWORKS_FUSED_NONE;
              SD_NCK(ANeuralNetworksModel_setOperandValue(L->model, 1, L->w.data(), L->w.size()));
              SD_NCK(ANeuralNetworksModel_setOperandValue(L->model, 2, L->bias.data(), L->bias.size() * 4));
              SD_NCK(ANeuralNetworksModel_setOperandValue(L->model, 3, &pad, 4));
              SD_NCK(ANeuralNetworksModel_setOperandValue(L->model, 4, &one, 4));
              SD_NCK(ANeuralNetworksModel_setOperandValue(L->model, 5, &one, 4));
              SD_NCK(ANeuralNetworksModel_setOperandValue(L->model, 6, &act, 4));
              uint32_t op_in[7]  = {0, 1, 2, 3, 4, 5, 6};
              uint32_t op_out[1] = {7};
              SD_NCK(ANeuralNetworksModel_addOperation(L->model, ANEURALNETWORKS_CONV_2D, 7, op_in, 1, op_out));
              uint32_t m_in[1]  = {0};
              uint32_t m_out[1] = {7};
              SD_NCK(ANeuralNetworksModel_identifyInputsAndOutputs(L->model, 1, m_in, 1, m_out));
              SD_NCK(ANeuralNetworksModel_finish(L->model));
              const ANeuralNetworksDevice* devs[1] = {dev};
              SD_NCK(ANeuralNetworksCompilation_createForDevices(L->model, devs, 1, &L->comp));
              SD_NCK(ANeuralNetworksCompilation_setPreference(L->comp, ANEURALNETWORKS_PREFER_SUSTAINED_SPEED));
              uint64_t h[4] = {1469598103934665603ULL, 0x9E3779B97F4A7C15ULL, 0xC2B2AE3D27D4EB4FULL, 0x165667B19E3779F9ULL};
              sd_mix_bytes(h, shortn.data(), shortn.size());
              sd_mix_bytes(h, &L->in_scale, 4);
              sd_mix_bytes(h, &L->out_scale, 4);
              sd_mix_bytes(h, &L->T, 4);
              sd_mix_bytes(h, L->ws.data(), L->ws.size() * 4);
              sd_mix_bytes(h, L->w.data(), L->w.size());
              uint8_t token[32];
              memcpy(token, h, 32);
              SD_NCK(ANeuralNetworksCompilation_setCaching(L->comp, cache, token));
              SD_NCK(ANeuralNetworksCompilation_finish(L->comp));
              fprintf(stderr, "[npu] %s ready in %.0f ms\n", shortn.c_str(), sd_now_ms() - t0);
              return L;
          }

          static void sd_npu_op(struct ggml_tensor* dst, int ith, int nth, void* ud) {
              (void)nth;
              if (ith != 0) {
                  return;
              }
              SdNpuLayer* L        = (SdNpuLayer*)ud;
              const ggml_tensor* a = dst->src[0];
              const int64_t din    = a->ne[0];
              const int64_t dout   = dst->ne[0];
              const int64_t n1     = a->ne[1];
              const int64_t n2     = a->ne[2];
              const int64_t rows   = n1 * n2 * a->ne[3];
              for (int64_t r0 = 0; r0 < rows; r0 += L->T) {
                  double t0        = sd_now_ms();
                  const int64_t nr = std::min<int64_t>(L->T, rows - r0);
                  for (int64_t r = 0; r < L->T; r++) {
                      int8_t* q = &L->qin[(size_t)r * (size_t)din];
                      if (r >= nr) {
                          memset(q, 0, (size_t)din);
                          continue;
                      }
                      const int64_t rr = r0 + r;
                      const char* src  = (const char*)a->data + (rr % n1) * a->nb[1] + ((rr / n1) % n2) * a->nb[2] + (rr / (n1 * n2)) * a->nb[3];
                      for (int64_t j = 0; j < din; j++) {
                          float v = *(const float*)(src + j * a->nb[0]) * L->inv[(size_t)j];
                          long iv = lrintf(v);
                          q[j]    = (int8_t)(iv > 127 ? 127 : (iv < -127 ? -127 : iv));
                      }
                  }
                  double t1                    = sd_now_ms();
                  ANeuralNetworksExecution* ex = nullptr;
                  bool ok                      = ANeuralNetworksExecution_create(L->comp, &ex) == ANEURALNETWORKS_NO_ERROR;
                  if (ok) {
                      ok = ANeuralNetworksExecution_setInput(ex, 0, nullptr, L->qin.data(), L->qin.size()) == ANEURALNETWORKS_NO_ERROR;
                  }
                  if (ok) {
                      ok = ANeuralNetworksExecution_setOutput(ex, 0, nullptr, L->qout.data(), L->qout.size()) == ANEURALNETWORKS_NO_ERROR;
                  }
                  if (ok) {
                      ok = ANeuralNetworksExecution_compute(ex) == ANEURALNETWORKS_NO_ERROR;
                  }
                  if (ex != nullptr) {
                      ANeuralNetworksExecution_free(ex);
                  }
                  if (!ok) {
                      fprintf(stderr, "[npu] execution failed\n");
                      abort();
                  }
                  double t2 = sd_now_ms();
                  for (int64_t r = 0; r < nr; r++) {
                      const int64_t rr = r0 + r;
                      char* o          = (char*)dst->data + (rr % n1) * dst->nb[1] + ((rr / n1) % n2) * dst->nb[2] + (rr / (n1 * n2)) * dst->nb[3];
                      const int8_t* q  = &L->qout[(size_t)r * (size_t)dout];
                      for (int64_t j = 0; j < dout; j++) {
                          *(float*)(o + j * dst->nb[0]) = (float)q[j] * L->out_scale;
                      }
                  }
                  double t3 = sd_now_ms();
                  g_sd_npu_stats.prep_ms += (t1 - t0) + (t3 - t2);
                  g_sd_npu_stats.npu_ms += (t2 - t1);
                  g_sd_npu_stats.tiles++;
              }
              g_sd_npu_stats.calls++;
          }

          static bool sd_npu_short(const char* nm, int* block, std::string* shortn) {
              const char* p = strstr(nm, "net.blocks.");
              if (p == nullptr || strstr(nm, "adaln") != nullptr || strstr(nm, "diffusion_model") == nullptr) {
                  return false;
              }
              p += strlen("net.blocks.");
              int b           = atoi(p);
              const char* dot = strchr(p, '.');
              if (dot == nullptr) {
                  return false;
              }
              std::string rest(dot + 1);
              size_t pos = rest.rfind(".weight");
              if (pos == std::string::npos) {
                  return false;
              }
              rest = rest.substr(0, pos);
              for (auto& c : rest) {
                  if (c == '.') {
                      c = '_';
                  }
              }
              *block  = b;
              *shortn = "b" + std::to_string(b) + "_" + rest;
              return true;
          }

          static ggml_tensor* sd_npu_try(ggml_context* ctx, ggml_tensor* x, ggml_tensor* w, ggml_tensor* b, float scale) {
              static const char* pack = getenv("SD_NPU_PACK");
              if (pack == nullptr || w == nullptr || b != nullptr || scale != 1.f || x->type != GGML_TYPE_F32) {
                  return nullptr;
              }
              int block = 0;
              std::string shortn;
              if (!sd_npu_short(w->name, &block, &shortn)) {
                  return nullptr;
              }
              static std::vector<int> only = []() {
                  std::vector<int> v;
                  const char* e = getenv("SD_NPU_BLOCKS");
                  if (e != nullptr) {
                      std::string s(e);
                      size_t i = 0;
                      while (i < s.size()) {
                          size_t j = s.find(',', i);
                          if (j == std::string::npos) {
                              j = s.size();
                          }
                          v.push_back(atoi(s.substr(i, j - i).c_str()));
                          i = j + 1;
                      }
                  }
                  return v;
              }();
              if (!only.empty() && std::find(only.begin(), only.end(), block) == only.end()) {
                  return nullptr;
              }
              auto& reg     = sd_npu_reg();
              auto it       = reg.find(shortn);
              SdNpuLayer* L = nullptr;
              if (it == reg.end()) {
                  L           = sd_npu_load(shortn);
                  reg[shortn] = L;
              } else {
                  L = it->second;
              }
              if (L == nullptr || L->din != (int)x->ne[0] || L->dout != (int)w->ne[1]) {
                  return nullptr;
              }
              ggml_tensor* args[1] = {x};
              return ggml_custom_4d(ctx, GGML_TYPE_F32, L->dout, x->ne[1], x->ne[2], x->ne[3], args, 1, sd_npu_op, 1, L);
          }

          static ggml_tensor* ggml_ext_linear_orig(ggml_context* ctx,
                                                   ggml_tensor* x,
                                                   ggml_tensor* w,
                                                   ggml_tensor* b,
                                                   bool force_prec_f32,
                                                   float scale);

          ggml_tensor* ggml_ext_linear(ggml_context* ctx,
                                       ggml_tensor* x,
                                       ggml_tensor* w,
                                       ggml_tensor* b,
                                       bool force_prec_f32,
                                       float scale) {
              ggml_tensor* npu = sd_npu_try(ctx, x, w, b, scale);
              if (npu != nullptr) {
                  return npu;
              }
              return ggml_ext_linear_orig(ctx, x, w, b, force_prec_f32, scale);
          }

          '''
          p = 'sd/src/core/ggml_extend.cpp'
          s = open(p).read()
          a1 = 'ggml_tensor* ggml_ext_linear(ggml_context* ctx,'
          assert s.count(a1) == 1, 'anchor count %d' % s.count(a1)
          s = s.replace(a1, HELPERS + 'static ggml_tensor* ggml_ext_linear_orig(ggml_context* ctx,')
          open(p, 'w').write(HEAD + s)
          print('patched ok')
          EOF
          cd sd
          NDK=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}
          echo NDK $NDK
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16 -DGGML_OPENMP=OFF "-DCMAKE_CXX_STANDARD_LIBRARIES=-lneuralnetworks"
          cmake --build build --config Release -j4
          ls -la build/bin
      - name: bundle
        run: |
          mkdir -p out
          cp sd/build/bin/sd-cli out/
          cp -r pack out/
          du -sh out
      - uses: actions/upload-artifact@v4
        with:
          name: npu-sd
          path: out
