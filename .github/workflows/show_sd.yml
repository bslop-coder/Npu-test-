name: show-sd
on: workflow_dispatch
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: print function
        run: |
          git clone https://github.com/leejet/stable-diffusion.cpp sd
          cd sd
          git checkout 0886f11b6b8b4d1f6259e0f1337cae554284c37a
          echo ---- IMATRIX CPP
          sed -n '1,280p' src/runtime/imatrix.cpp || true
          echo ---- IMATRIX HEADER
          cat src/runtime/imatrix.h || true
          echo ---- IMATRIX MENTIONS
          grep -rn "imatrix" examples include CMakeLists.txt src --include=*.cpp --include=*.h --include=*.txt | grep -v "^src/runtime/imatrix.cpp" | head -30 || true
          echo ---- TYPE AND THREAD FLAGS
          grep -n -e '"--type"' -e '"--threads"' -e '"-t"' -e '"--output"' -e '"-W"' -e '"-H"' -e '"--width"' -e '"--height"' examples/common/common.cpp | head -20 || true
