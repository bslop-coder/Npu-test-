name: show-sd
on: workflow_dispatch
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: print function
        run: |
          git clone https://github.com/leejet/stable-diffusion.cpp sd
          cd sd
          git checkout 0886f11b6b8b4d1f6259e0f1337cae554284c37a
          echo ---- CALLBACK USES
          grep -rn "eval_callback" src include examples | head -40 || true
          echo ---- BACKEND 600-680
          sed -n '600,680p' src/core/ggml_extend_backend.cpp || true
          echo ---- LINEAR 205-245
          sed -n '205,245p' src/core/ggml_extend.cpp || true
          echo ---- ANIMA DOC
          cat docs/anima.md | head -80 || true
          echo ---- CLI FLAGS
          grep -n -e "--llm" -e "--diffusion-model" -e "--vae" -e "--cfg-scale" -e "--steps" -e "--diffusion-fa" -e "--offload" -e "--seed" examples/common/common.cpp | head -40 || true
