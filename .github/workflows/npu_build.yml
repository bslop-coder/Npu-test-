name: npu-build
on: workflow_dispatch
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: restore models
        uses: actions/cache/restore@v4
        with:
          path: models
          key: anima-models-v1
          fail-on-cache-miss: true
      - name: restore dumps
        uses: actions/cache/restore@v4
        with:
          path: |
            dumpA
            dumpB
            statsA
          key: dumps-v1
          fail-on-cache-miss: true
      - name: write pack builder
        run: |
          cat > make_pack.py <<'EOF'
          import os, json, struct
          import numpy as np

          BLOCK = 13
          T = 256
          absmax, sumsq, outm = {}, {}, {}
          for line in open('statsA/chan_absmax.txt'):
              p = line.rstrip('\n').split('\t')
              absmax[p[0]] = np.array(p[2].split(), dtype=np.float64)
          for line in open('statsA/chan_sumsq.txt'):
              p = line.rstrip('\n').split('\t')
              sumsq[p[0]] = (float(p[1]), np.array(p[3].split(), dtype=np.float64))
          for line in open('statsA/out_amax.txt'):
              p = line.rstrip('\n').split('\t')
              outm[p[0]] = float(p[1])

          fh = open('models/dit.safetensors', 'rb')
          hl = struct.unpack('<Q', fh.read(8))[0]
          hdr = json.loads(fh.read(hl))
          base = 8 + hl
          keymap = {}
          for k in hdr:
              if k == '__metadata__' or 'llm_adapter' in k or 'blocks.' not in k:
                  continue
              keymap[k[k.index('blocks.'):]] = k

          def get_w(name):
              key = keymap[name[name.index('blocks.'):]]
              m = hdr[key]
              s0, e0 = m['data_offsets']
              fh.seek(base + s0)
              raw = fh.read(e0 - s0)
              if m['dtype'] == 'BF16':
                  a = (np.frombuffer(raw, dtype=np.uint16).astype(np.uint32) << 16).view(np.float32)
              elif m['dtype'] == 'F16':
                  a = np.frombuffer(raw, dtype=np.float16).astype(np.float32)
              else:
                  a = np.frombuffer(raw, dtype=np.float32)
              return a.reshape(m['shape']).astype(np.float32)

          tag = 'net.blocks.%d.' % BLOCK
          names = sorted(n for n in outm if n in absmax and n in sumsq and tag in n)
          print('layers', len(names))
          os.makedirs('pack', exist_ok=True)
          order = []
          for name in names:
              short = 'b%d_%s' % (BLOCK, name.split('blocks.%d.' % BLOCK)[1].replace('.weight', '').replace('.', '_'))
              W = get_w(name)
              dout, din = W.shape
              am = absmax[name]
              cnt, sq = sumsq[name]
              rms = np.sqrt(np.maximum(sq / max(cnt, 1.0), 0.0))
              med = np.median(rms)
              s = np.clip(np.sqrt(np.maximum(rms, 1e-6) / max(med, 1e-6)), 0.05, 20.0).astype(np.float32)
              in_scale = float(np.max(am / s)) / 127.0
              out_scale = outm[name] / 127.0
              Wp = (W * s[None, :]).astype(np.float32)
              ws = np.maximum(np.abs(Wp).max(axis=1), 1e-8) / 127.0
              qW = np.clip(np.rint(Wp / ws[:, None]), -127, 127).astype(np.int8)
              XB = np.fromfile('dumpB/%s.f32' % name, dtype=np.float32).reshape(-1, din)
              X = XB[T:2 * T] if XB.shape[0] >= 2 * T else XB[:T]
              qin = np.clip(np.rint((X / s[None, :]) / in_scale), -127, 127).astype(np.int8)
              acc = qin.astype(np.float64) @ qW.astype(np.float64).T
              y = acc * (in_scale * ws.astype(np.float64))[None, :]
              refq = np.clip(np.rint(y / out_scale), -127, 127).astype(np.int8)
              reff = (X @ W.T).astype(np.float32)
              open('pack/%s.meta' % short, 'w').write('%d %d %d %.9g %.9g\n' % (din, dout, X.shape[0], in_scale, out_scale))
              qW.tofile('pack/%s.w' % short)
              ws.astype(np.float32).tofile('pack/%s.ws' % short)
              qin.tofile('pack/%s.in' % short)
              refq.tofile('pack/%s.refq' % short)
              reff.tofile('pack/%s.reff' % short)
              order.append(short)
              print('packed', short, din, dout, 'in_scale %.5f out_scale %.5f' % (in_scale, out_scale))
          open('pack/layers.txt', 'w').write('\n'.join(order) + '\n')
          EOF
      - name: build pack
        run: |
          pip install numpy
          python3 make_pack.py
          du -sh pack
      - name: write native test
        run: |
          mkdir -p ndk
          cat > ndk/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.18)
          project(npu_test CXX)
          set(CMAKE_CXX_STANDARD 17)
          add_executable(npu_test npu_test.cpp)
          target_link_libraries(npu_test neuralnetworks log)
          EOF
          cat > ndk/npu_test.cpp <<'EOF'
          #include <android/NeuralNetworks.h>
          #include <sys/stat.h>

          #include <chrono>
          #include <cmath>
          #include <cstdint>
          #include <cstdio>
          #include <cstdlib>
          #include <cstring>
          #include <fstream>
          #include <string>
          #include <vector>

          static double now_ms() {
              auto t = std::chrono::steady_clock::now().time_since_epoch();
              return std::chrono::duration<double, std::milli>(t).count();
          }

          static bool read_file(const std::string& path, std::vector<char>& out) {
              std::ifstream f(path, std::ios::binary);
              if (!f) {
                  fprintf(stderr, "cannot open %s\n", path.c_str());
                  return false;
              }
              f.seekg(0, std::ios::end);
              size_t n = (size_t)f.tellg();
              f.seekg(0, std::ios::beg);
              out.resize(n);
              f.read(out.data(), (std::streamsize)n);
              return (bool)f;
          }

          #define CK(x)                                                                     \
              do {                                                                          \
                  int r_ = (x);                                                             \
                  if (r_ != ANEURALNETWORKS_NO_ERROR) {                                     \
                      fprintf(stderr, "NNAPI error %d at line %d: %s\n", r_, __LINE__, #x); \
                      return false;                                                         \
                  }                                                                         \
              } while (0)

          struct Layer {
              std::string name;
              int din       = 0;
              int dout      = 0;
              int T         = 0;
              float in_scale  = 0.f;
              float out_scale = 0.f;
              std::vector<char> w;
              std::vector<float> ws;
              std::vector<char> in;
              std::vector<char> refq;
              std::vector<float> reff;
          };

          static bool load_layer(const std::string& dir, const std::string& name, Layer& L) {
              L.name           = name;
              std::string base = dir + "/" + name;
              std::ifstream m(base + ".meta");
              if (!m) {
                  fprintf(stderr, "no meta for %s\n", name.c_str());
                  return false;
              }
              m >> L.din >> L.dout >> L.T >> L.in_scale >> L.out_scale;
              std::vector<char> raw;
              if (!read_file(base + ".w", L.w)) return false;
              if (!read_file(base + ".ws", raw)) return false;
              L.ws.resize(raw.size() / 4);
              memcpy(L.ws.data(), raw.data(), raw.size());
              if (!read_file(base + ".in", L.in)) return false;
              if (!read_file(base + ".refq", L.refq)) return false;
              if (!read_file(base + ".reff", raw)) return false;
              L.reff.resize(raw.size() / 4);
              memcpy(L.reff.data(), raw.data(), raw.size());
              if ((long)L.w.size() != (long)L.din * L.dout || (int)L.ws.size() != L.dout ||
                  (long)L.in.size() != (long)L.T * L.din || (long)L.refq.size() != (long)L.T * L.dout ||
                  (long)L.reff.size() != (long)L.T * L.dout) {
                  fprintf(stderr, "size mismatch in %s\n", name.c_str());
                  return false;
              }
              return true;
          }

          static void mix_bytes(uint64_t h[4], const void* p, size_t n) {
              const uint8_t* b = (const uint8_t*)p;
              size_t i         = 0;
              for (; i + 8 <= n; i += 8) {
                  uint64_t v;
                  memcpy(&v, b + i, 8);
                  for (int k = 0; k < 4; k++) {
                      h[k] ^= v + 0x9E3779B97F4A7C15ULL * (uint64_t)(k + 1) + (h[k] << 6) + (h[k] >> 2);
                  }
              }
              for (; i < n; i++) {
                  for (int k = 0; k < 4; k++) {
                      h[k] ^= b[i];
                      h[k] *= 1099511628211ULL;
                  }
              }
          }

          static void make_token(const Layer& L, uint8_t* tok) {
              uint64_t h[4] = {1469598103934665603ULL, 0x9E3779B97F4A7C15ULL, 0xC2B2AE3D27D4EB4FULL, 0x165667B19E3779F9ULL};
              mix_bytes(h, L.name.data(), L.name.size());
              mix_bytes(h, &L.in_scale, 4);
              mix_bytes(h, &L.out_scale, 4);
              mix_bytes(h, &L.T, 4);
              mix_bytes(h, L.ws.data(), L.ws.size() * 4);
              mix_bytes(h, L.w.data(), L.w.size());
              memcpy(tok, h, 32);
          }

          static bool exec_once(ANeuralNetworksCompilation* comp, Layer& L, std::vector<int8_t>& out) {
              ANeuralNetworksExecution* ex = nullptr;
              CK(ANeuralNetworksExecution_create(comp, &ex));
              CK(ANeuralNetworksExecution_setInput(ex, 0, nullptr, L.in.data(), L.in.size()));
              CK(ANeuralNetworksExecution_setOutput(ex, 0, nullptr, out.data(), out.size()));
              int r = ANeuralNetworksExecution_compute(ex);
              ANeuralNetworksExecution_free(ex);
              if (r != ANEURALNETWORKS_NO_ERROR) {
                  fprintf(stderr, "compute failed %d\n", r);
                  return false;
              }
              return true;
          }

          static bool build_and_run(Layer& L, const ANeuralNetworksDevice* dev, const std::string& cache_dir, int reps,
                                    double* compile_ms, double* run_ms, std::vector<int8_t>& out) {
              double t0                   = now_ms();
              ANeuralNetworksModel* model = nullptr;
              CK(ANeuralNetworksModel_create(&model));
              uint32_t in_dims[4]  = {1, (uint32_t)L.T, 1, (uint32_t)L.din};
              uint32_t w_dims[4]   = {(uint32_t)L.dout, 1, 1, (uint32_t)L.din};
              uint32_t b_dims[1]   = {(uint32_t)L.dout};
              uint32_t out_dims[4] = {1, (uint32_t)L.T, 1, (uint32_t)L.dout};
              ANeuralNetworksOperandType t_in  = {ANEURALNETWORKS_TENSOR_QUANT8_ASYMM_SIGNED, 4, in_dims, L.in_scale, 0};
              ANeuralNetworksOperandType t_w   = {ANEURALNETWORKS_TENSOR_QUANT8_SYMM_PER_CHANNEL, 4, w_dims, 0.0f, 0};
              ANeuralNetworksOperandType t_b   = {ANEURALNETWORKS_TENSOR_INT32, 1, b_dims, 0.0f, 0};
              ANeuralNetworksOperandType t_i32 = {ANEURALNETWORKS_INT32, 0, nullptr, 0.0f, 0};
              ANeuralNetworksOperandType t_out = {ANEURALNETWORKS_TENSOR_QUANT8_ASYMM_SIGNED, 4, out_dims, L.out_scale, 0};
              CK(ANeuralNetworksModel_addOperand(model, &t_in));
              CK(ANeuralNetworksModel_addOperand(model, &t_w));
              CK(ANeuralNetworksModel_addOperand(model, &t_b));
              CK(ANeuralNetworksModel_addOperand(model, &t_i32));
              CK(ANeuralNetworksModel_addOperand(model, &t_i32));
              CK(ANeuralNetworksModel_addOperand(model, &t_i32));
              CK(ANeuralNetworksModel_addOperand(model, &t_i32));
              CK(ANeuralNetworksModel_addOperand(model, &t_out));
              ANeuralNetworksSymmPerChannelQuantParams qp;
              qp.channelDim = 0;
              qp.scaleCount = (uint32_t)L.dout;
              qp.scales     = L.ws.data();
              CK(ANeuralNetworksModel_setOperandSymmPerChannelQuantParams(model, 1, &qp));
              std::vector<int32_t> bias((size_t)L.dout, 0);
              int32_t pad = ANEURALNETWORKS_PADDING_VALID;
              int32_t one = 1;
              int32_t act = ANEURALNETWORKS_FUSED_NONE;
              CK(ANeuralNetworksModel_setOperandValue(model, 1, L.w.data(), L.w.size()));
              CK(ANeuralNetworksModel_setOperandValue(model, 2, bias.data(), bias.size() * 4));
              CK(ANeuralNetworksModel_setOperandValue(model, 3, &pad, 4));
              CK(ANeuralNetworksModel_setOperandValue(model, 4, &one, 4));
              CK(ANeuralNetworksModel_setOperandValue(model, 5, &one, 4));
              CK(ANeuralNetworksModel_setOperandValue(model, 6, &act, 4));
              uint32_t op_in[7]  = {0, 1, 2, 3, 4, 5, 6};
              uint32_t op_out[1] = {7};
              CK(ANeuralNetworksModel_addOperation(model, ANEURALNETWORKS_CONV_2D, 7, op_in, 1, op_out));
              uint32_t m_in[1]  = {0};
              uint32_t m_out[1] = {7};
              CK(ANeuralNetworksModel_identifyInputsAndOutputs(model, 1, m_in, 1, m_out));
              CK(ANeuralNetworksModel_finish(model));

              ANeuralNetworksCompilation* comp = nullptr;
              const ANeuralNetworksDevice* devs[1] = {dev};
              CK(ANeuralNetworksCompilation_createForDevices(model, devs, 1, &comp));
              CK(ANeuralNetworksCompilation_setPreference(comp, ANEURALNETWORKS_PREFER_SUSTAINED_SPEED));
              uint8_t token[32];
              make_token(L, token);
              CK(ANeuralNetworksCompilation_setCaching(comp, cache_dir.c_str(), token));
              CK(ANeuralNetworksCompilation_finish(comp));
              *compile_ms = now_ms() - t0;

              out.assign((size_t)L.T * L.dout, 0);
              if (!exec_once(comp, L, out)) return false;
              double t1 = now_ms();
              std::vector<int8_t> tmp(out.size());
              for (int i = 0; i < reps; i++) {
                  if (!exec_once(comp, L, tmp)) return false;
              }
              *run_ms = (now_ms() - t1) / (double)reps;
              ANeuralNetworksCompilation_free(comp);
              ANeuralNetworksModel_free(model);
              return true;
          }

          int main(int argc, char** argv) {
              if (argc < 3) {
                  printf("usage: npu_test PACKDIR CACHEDIR [reps]\n");
                  return 1;
              }
              std::string pack  = argv[1];
              std::string cache = argv[2];
              int reps          = argc > 3 ? atoi(argv[3]) : 20;
              const char* want  = getenv("NPU_DEV") ? getenv("NPU_DEV") : "mtk-mdla";
              mkdir(cache.c_str(), 0755);
              uint32_t nd = 0;
              ANeuralNetworks_getDeviceCount(&nd);
              ANeuralNetworksDevice* dev = nullptr;
              for (uint32_t i = 0; i < nd; i++) {
                  ANeuralNetworksDevice* d = nullptr;
                  ANeuralNetworks_getDevice(i, &d);
                  const char* nm = nullptr;
                  ANeuralNetworksDevice_getName(d, &nm);
                  printf("device %u: %s\n", i, nm ? nm : "?");
                  if (nm != nullptr && strcmp(nm, want) == 0) dev = d;
              }
              if (dev == nullptr) {
                  printf("device %s not found\n", want);
                  return 2;
              }
              std::vector<std::string> names;
              {
                  std::ifstream f(pack + "/layers.txt");
                  std::string line;
                  while (std::getline(f, line)) {
                      if (!line.empty()) names.push_back(line);
                  }
              }
              printf("using %s, %d layers, %d reps\n", want, (int)names.size(), reps);
              double tot_compile = 0, tot_run = 0;
              for (auto& nm : names) {
                  Layer L;
                  if (!load_layer(pack, nm, L)) {
                      printf("%s: load failed\n", nm.c_str());
                      continue;
                  }
                  double cms = 0, rms = 0;
                  std::vector<int8_t> out;
                  if (!build_and_run(L, dev, cache, reps, &cms, &rms, out)) {
                      printf("%s: FAILED\n", nm.c_str());
                      continue;
                  }
                  size_t n = out.size();
                  size_t exact = 0, w1 = 0;
                  int maxd = 0;
                  double num = 0, den = 0;
                  for (size_t i = 0; i < n; i++) {
                      int d = std::abs((int)out[i] - (int)(int8_t)L.refq[i]);
                      if (d == 0) exact++;
                      if (d <= 1) w1++;
                      if (d > maxd) maxd = d;
                      double r = L.reff[i];
                      double e = (double)out[i] * L.out_scale;
                      num += r * r;
                      den += (r - e) * (r - e);
                  }
                  double snr = 10.0 * std::log10(num / (den > 1e-30 ? den : 1e-30));
                  printf("%-26s cold %8.1f ms  run %6.2f ms  exact %5.1f%%  within1 %5.1f%%  maxdiff %3d  snr %5.1f dB\n", nm.c_str(),
                         cms, rms, 100.0 * exact / n, 100.0 * w1 / n, maxd, snr);
                  fflush(stdout);
                  tot_compile += cms;
                  tot_run += rms;
              }
              printf("total compile %.1f ms, total run per 256-token tile %.2f ms\n", tot_compile, tot_run);
              return 0;
          }
          EOF
      - name: build native test
        run: |
          NDK=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}
          echo NDK $NDK
          cmake -S ndk -B ndk/build -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
          cmake --build ndk/build
          ls -la ndk/build/npu_test
      - name: bundle
        run: |
          mkdir -p out
          cp ndk/build/npu_test out/
          cp -r pack out/
          du -sh out
      - uses: actions/upload-artifact@v4
        with:
          name: npu-pack
          path: out
