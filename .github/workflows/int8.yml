name: make-int8
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "tensorflow==2.15.0" "numpy<2"
      - run: python make_int8.py
      - uses: actions/upload-artifact@v4
        with:
          name: int8
          path: "*.tflite"
